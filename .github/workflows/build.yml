name: 'mpatel-maven-webgoat'
on:
  push:
    branches:
      - "**"
  pull_request:
    types: 
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  PROJECT_KEY: "rsa-demo"
  RT_REPO_MVN_RELEASE: "rsa-demo-maven-release"
  RT_REPO_MVN_SNAPSHOT: "rsa-demo-maven-snapshot"
  RT_REPO_DOCKER_LOCAL: "rsa-demo-docker-local"

jobs:
 mvn-build-and-publish:
   runs-on: ubuntu-latest
   env:
     BUILD_NAME: 'maven-webgoat'
     JFROG_BUILD_STATUS: PASS
   steps:
     - name: Checkout
       uses: actions/checkout@v4
     - name: Set up JDK 17
       uses: actions/setup-java@v4
       with:
        java-version: '17'
        distribution: 'temurin'
     - name: Setup JFrog CLI
       uses: jfrog/setup-jfrog-cli@v4
       id: setup-cli
       env:
        JF_URL: ${{ secrets.JF_URL }}
       with:
        version: '2.96.0'
        oidc-provider-name: omriz-oidc
        oidc-audience: omriz-oidc
     - name: Health check JFrog Artifactory instance 🐸
       run: |
        jf --version
        jf rt ping
        jf mvnc --repo-resolve-releases "${{ env.RT_REPO_MVN_RELEASE }}" --repo-resolve-snapshots "${{ env.RT_REPO_MVN_SNAPSHOT }}" --repo-deploy-releases "${{ env.RT_REPO_MVN_RELEASE }}" --repo-deploy-snapshots "${{ env.RT_REPO_MVN_SNAPSHOT }}"
     - name: Fix Code Formatting with Spotless
       run: jf mvn spotless:apply
     - name: Curation Audit
       run: |
        jf ca --format=table --threads=100
     - name: Build Maven Package
       run: |
        jf mvn clean install -f pom.xml -Dmaven.test.skip=true -Dartifactory.publish.artifacts=true --build-name ${{env.BUILD_NAME}} --build-number ${{github.run_number}} --project ${{env.PROJECT_KEY}}
     # - name: Security Audit
     #   run: |
     #    jf audit
     - name: Login to JFrog Artifactory (Docker)
       env:
         JF_URL: ${{ secrets.JF_URL }}
         JF_ARTIFACTORY_USER: omriz
         JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
       run: |
         JF_HOST="${JF_URL#https://}"
         echo "JF_HOST=${JF_HOST}" >> $GITHUB_ENV
         echo "$JF_ACCESS_TOKEN" | docker login "$JF_HOST" -u "$JF_ARTIFACTORY_USER" --password-stdin

     - name: Build Docker image
       id: build-docker
       env:
         JF_URL: ${{ secrets.JF_URL }}
         BUILD_NUMBER: ${{ github.run_number }}
       run: |
         JF_HOST="${JF_URL#https://}"
         IMAGE_TAG="${BUILD_NUMBER}"
         jf docker build \
           -f Dockerfile \
           --label build.number="${BUILD_NUMBER}" \
           --label build.name="${BUILD_NAME}" \
           --label project.name="${PROJECT_KEY}" \
           --label author="${{ github.actor }}" \
           -t "$JF_HOST/${{ env.RT_REPO_DOCKER_LOCAL }}/maven-webgoat:${IMAGE_TAG}" \
           .
     - name: Scan Docker image with JFrog Xray
       env:
         JF_URL: ${{ secrets.JF_URL }}
       run: |
         JF_HOST="${JF_URL#https://}"
         IMAGE_TAG="${{ github.run_number }}"
         IMAGE_REF="$JF_HOST/${{ env.RT_REPO_DOCKER_LOCAL }}/maven-webgoat:${IMAGE_TAG}"
         jf docker scan "$IMAGE_REF" --project "${{ env.PROJECT_KEY }}"
     - name: Push Docker image to JFrog Artifactory
       env:
         JF_URL: ${{ secrets.JF_URL }}
       run: |
         JF_HOST="${JF_URL#https://}"
         IMAGE_TAG="${{ github.run_number }}"
         IMAGE_REF="$JF_HOST/${{ env.RT_REPO_DOCKER_LOCAL }}/maven-webgoat:${IMAGE_TAG}"
         jf docker push "$IMAGE_REF"
         # jf rt build-docker-create expects one line: image-tag@sha256:<digest>
         MANIFEST_DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE_REF" | jq -r '.digest')
         echo "${IMAGE_REF}@${MANIFEST_DIGEST}" > build-metadata
     - name: Publish Docker build info to JFrog Artifactory
       run: |
          jf rt build-docker-create "/${{ env.RT_REPO_DOCKER_LOCAL }}" --image-file=build-metadata \
            --build-name="${{ env.BUILD_NAME }}" \
            --build-number="${{ github.run_number }}" \
            --project="${{ env.PROJECT_KEY }}"
     - name: Publish build build-info
       run: |
         # Collect and store environment variables in the build-info
         jf rt bce ${{env.BUILD_NAME}} ${{github.run_number}}  --project "${PROJECT_KEY}"
         # Collect and store VCS details in the build-info
         jf rt bag ${{env.BUILD_NAME}} ${{github.run_number}}  --project "${PROJECT_KEY}"
         # Publish the build-info to Artifactory
         jf rt bp ${{env.BUILD_NAME}} ${{github.run_number}}  --project "${PROJECT_KEY}"
         # Scan the published build-info with Xray
         jf rt bs ${{env.BUILD_NAME}} ${{github.run_number}}  --project "${PROJECT_KEY}"
